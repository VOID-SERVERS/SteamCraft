plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

group = project.maven_group
version = project.mod_version

sourceSets {
	client {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}

neoForge {
	neoFormVersion = project.neoform_version
	addModdingDependenciesTo(sourceSets.client)
}

repositories {
	mavenCentral()
	maven {
		name = 'Sponge'
		url = 'https://repo.spongepowered.org/repository/maven-public/'
		content { includeGroupAndSubgroups 'org.spongepowered' }
	}
}

dependencies {
	api project(':core')
	compileOnly "org.spongepowered:mixin:${project.mixin_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	clientCompileOnly "org.spongepowered:mixin:${project.mixin_version}"
	clientCompileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"
	clientImplementation project(':core')
}

def javaVersion = stonecutter.eval(stonecutter.current.version, '>=26.1') ? 25 : 21

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}
