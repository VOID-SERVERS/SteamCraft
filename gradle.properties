# Ten Minecraft versions with Loom take more than 2 GB in the Gradle daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
# Leaves cores free, and runs Gradle and its forked processes at low priority so the machine stays usable.
org.gradle.workers.max=12
org.gradle.priority=low

mod_version=0.1.0-alpha
maven_group=dev.steamcraft

steamworks4j_version=1.10.0

loader_version=0.20.1
loom_version=1.19-SNAPSHOT
loomx.loom_version=1.19-SNAPSHOT
fabric_installer_version=1.1.2

moddev_version=2.0.148
mixin_version=0.8.5
mixinextras_version=0.4.1
dev.kikugie.stonecutter.hard_mode=true
